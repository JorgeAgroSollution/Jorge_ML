[project]
name = "agro-ml"
version = "0.1.0"
description = "Previsão de produtividade agrícola (kg/ha) para municípios de SP, com API FastAPI"
readme = "README.md"
requires-python = ">=3.13"
# Grupo principal: só o que a API precisa para carregar os artefatos e prever.
# scikit-learn fica fixo na versão que gerou os .joblib (abrir com outra versão dá InconsistentVersionWarning).
# pyarrow também é da API: o pandas 3 guardou as colunas de texto do perfil_local com o tipo do pyarrow,
# e sem ele o joblib.load falha.
dependencies = [
    "fastapi>=0.115",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "scikit-learn==1.9.1",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
# Coleta e montagem dos dados (build_dataset.py) e treino (modelar_culturas.py).
pipeline = [
    "agrobr>=2.0",
    "geopandas>=1.2.0",
]
# Análise exploratória (EDA/).
notebook = [
    "ipykernel>=7.4.0",
    "jupytext>=1.19.6",
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
]
# Testes. O `uv sync` instala este grupo por padrão; `uv sync --no-dev` deixa só a API.
dev = [
    "httpx>=0.28",
    "pytest>=9.1.1",
]
